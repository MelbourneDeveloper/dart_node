name: Publish Tier 2

on:
  push:
    tags:
      - 'Release-Tier2/[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pub.dev-tier2
    steps:
      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/Release-Tier2/}" >> $GITHUB_OUTPUT

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          dart-version: ${{ vars.DART_VERSION }}

      # [SWR-VERSION-BUILD-STAMPING] Stamp the version from the tag in the
      # runner working tree ONLY. Source stays 0.0.0-dev; nothing is committed,
      # pushed, or branched. The runner is discarded after publish.
      - name: Stamp versions in the working tree (not committed)
        run: dart run tools/prepare_publish.dart "${{ steps.version.outputs.VERSION }}"

      - name: Publish packages
        run: |
          chmod +x .github/scripts/publish-packages.sh
          .github/scripts/publish-packages.sh "${{ steps.version.outputs.VERSION }}" reflux dart_node_express dart_node_ws dart_node_better_sqlite3 dart_node_sql_js dart_node_mcp
